name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: ${{ matrix.node-version }}
          cache: true
      - uses: ./.github/actions/setup-release-pnpm
      - run: vp run check:workspace
      - run: vp run test:workspace
      - run: vp run --filter satteri-links-demo test:deploy
      - run: vp run release:check
      - run: vp run release:pack

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: 24
          cache: true
      - uses: ./.github/actions/setup-release-pnpm
      - name: Install Chromium
        run: pnpm --filter satteri-links-demo exec playwright install --with-deps chromium
      - name: Test the production demo
        run: vp run test:e2e
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure
          path: |
            demo/test-results/
            demo/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
