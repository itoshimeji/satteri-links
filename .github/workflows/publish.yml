name: Publish

# Resolve only a human-merged generated release PR. The actual execution ref
# must be main for the npm environment; checkout alone cannot change it.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_pr:
        description: Merged Changesets release PR to recover (for example 6)
        type: string
        required: true

permissions: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.repository == 'itoshimeji/satteri-links'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release-sha: ${{ steps.release.outputs.release-sha }}
      release-pr: ${{ steps.release.outputs.release-pr }}
    steps:
      # Read the resolver from the trusted workflow revision on main, never PR head.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve and authorize the immutable release commit
        id: release
        run: node scripts/resolve-release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  pack:
    needs: resolve
    if: needs.resolve.outputs.release-sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      pack-artifact: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.release-sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: 24
          cache: false
          run-install: |
            args: ['--frozen-lockfile']
      - uses: ./.github/actions/setup-release-pnpm
      - run: vp run check:workspace
      - run: vp run test:workspace
      - run: vp run release:check
      - run: vp run release:pack
      - uses: changesets/action/select-mode@v2.1.2
        id: mode
      - name: Reject unconsumed changesets
        if: steps.mode.outputs.mode == 'version'
        run: |
          echo 'Release PR still contains pending changesets; refusing to publish.' >&2
          exit 1
      - uses: changesets/action/pack@v2.1.2
        if: steps.mode.outputs.mode == 'publish'
        id: pack
        with:
          publish-plan-artifact-id: ${{ steps.mode.outputs.publish-plan-artifact-id }}
      - uses: actions/download-artifact@v8.0.1
        if: steps.mode.outputs.mode == 'publish'
        with:
          artifact-ids: ${{ steps.pack.outputs.pack-dir-artifact-id }}
          path: ${{ runner.temp }}/release-pack
          merge-multiple: true
      - name: Verify the exact publish artifact
        if: steps.mode.outputs.mode == 'publish'
        run: node scripts/verify-release-pack.mjs "${{ runner.temp }}/release-pack"

  publish:
    needs: [resolve, pack]
    if: needs.pack.outputs.mode == 'publish' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Confirm the actual deployment ref
        run: test "$GITHUB_REF" = 'refs/heads/main'
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.release-sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: 24
          cache: false
          run-install: |
            args: ['--frozen-lockfile']
      - uses: ./.github/actions/setup-release-pnpm
      - uses: changesets/action/publish@v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-artifact }}
          create-github-releases: true
          push-git-tags: true
        env:
          PNPM_CONFIG_PROVENANCE: "true"
