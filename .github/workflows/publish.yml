name: Publish

# A maintainer merging the release PR is the publication decision. Ordinary
# main pushes, feature PRs, and this infrastructure PR cannot publish packages.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  pack:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'changeset-release/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      pack-artifact: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: 24
          cache: false
          run-install: |
            args: ['--frozen-lockfile']
      - run: vp run check:workspace
      - run: vp run test:workspace
      - run: vp run release:check
      - run: vp run release:pack
      - uses: changesets/action/select-mode@v2.1.2
        id: mode
      - name: Reject unconsumed changesets
        if: steps.mode.outputs.mode == 'version'
        run: |
          echo 'Release PR still contains pending changesets; refusing to publish.' >&2
          exit 1
      - uses: changesets/action/pack@v2.1.2
        if: steps.mode.outputs.mode == 'publish'
        id: pack
        with:
          publish-plan-artifact-id: ${{ steps.mode.outputs.publish-plan-artifact-id }}
      - uses: actions/download-artifact@v8.0.1
        if: steps.mode.outputs.mode == 'publish'
        with:
          artifact-ids: ${{ steps.pack.outputs.pack-dir-artifact-id }}
          path: ${{ runner.temp }}/release-pack
          merge-multiple: true
      - name: Verify the exact publish artifact
        if: steps.mode.outputs.mode == 'publish'
        run: node scripts/verify-release-pack.mjs "${{ runner.temp }}/release-pack"

  publish:
    needs: pack
    if: needs.pack.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: 24
          cache: false
          run-install: |
            args: ['--frozen-lockfile']
      - uses: changesets/action/publish@v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-artifact }}
          create-github-releases: true
          push-git-tags: true
        env:
          PNPM_CONFIG_PROVENANCE: "true"
