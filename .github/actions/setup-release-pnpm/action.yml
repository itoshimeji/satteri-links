name: Set up release pnpm
description: Expose repository-pinned pnpm to Changesets child processes
runs:
  using: composite
  steps:
    - name: Read the repository pnpm version
      id: version
      shell: bash
      run: echo "version=$(node scripts/release-pnpm.mjs --expected-version)" >> "$GITHUB_OUTPUT"
    - uses: pnpm/action-setup@v4.4.0
      with:
        version: ${{ steps.version.outputs.version }}
        run_install: false
    - name: Verify pnpm in the child-process PATH
      shell: bash
      run: node scripts/release-pnpm.mjs
